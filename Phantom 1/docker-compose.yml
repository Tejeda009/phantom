services:
  phantom:
    cap_drop:
      - ALL
    build:
      context: ./challenge
      dockerfile: Dockerfile
    ports:
      - "30207:30207"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          pids: 50
          cpus: "1.0"
          memory: 1G
    read_only: true
    tmpfs:
      - /tmp:size=10M
      - /run:size=10M
    security_opt:
      - no-new-privileges:true
